name: VYRO
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  VYRO:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: VYRO
        NSPhotoLibraryUsageDescription: Import videos to edit.
        NSPhotoLibraryAddUsageDescription: Save your exported videos.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vyro
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
